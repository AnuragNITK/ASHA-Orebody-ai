[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minedesign"
version = "1.0.0"
description = "AI-assisted open-pit mine design: drillholes to ultimate pit limit, as one interactive report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mining", "geostatistics", "kriging", "block model", "pit optimization", "surpac"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "httpx>=0.26",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4"]
geometry = ["trimesh>=4.0"]
implicit = ["gempy>=2024.1"]
xls = ["xlrd>=2.0"]  # legacy .xls; .xlsx/.xlsm need only openpyxl above

[project.scripts]
minedesign = "run_pipeline:main"
minedesign-api = "minedesign.api:main"

[tool.setuptools]
packages = [
    "minedesign",
    "minedesign.ingest",
    "minedesign.geology",
    "minedesign.solid",
    "minedesign.blockmodel",
    "minedesign.pit",
    "minedesign.llm",
    "minedesign.report",
    "minedesign.gempy_model",
]

[tool.setuptools.package-data]
"minedesign.report" = ["templates/*.j2", "vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# E501: line length is enforced by the formatter, not the linter.
# B905: zip(strict=) is not available on the minimum supported Python.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# B008 is the documented FastAPI idiom for declaring dependencies and uploads.
"minedesign/api.py" = ["B008"]
